# Provenance for the vendored validation library (platform DECISIONS
# D-46, condition 1 — never an anonymous binary).
#
# Fence interpretation on record (D-46 condition 3): .github/vendor/ is
# CI tooling, not KB content. The "no platform code in the KB repo"
# rule means no platform logic in the KB tree; this wheel is the one
# sanctioned exception.
#
# Update path (D-46 condition 2): a validation-library change in the
# platform repo → rebuild the wheel → PR to this repo updating the
# wheel and this manifest together. Manual for now; CP-3 sync PRs may
# carry wheel bumps later. The failure mode this manifest exists to
# make visible: a stale wheel silently validating against old rules —
# check platform_commit against the platform repo before trusting a
# validation pass that "should" have caught something.
#
# THIS FILE IS THE ONLY PIN (platform ruling D-96 task 2, R-6 option
# (b), from security review #2 F7). kb-ci.yml reads `wheel:` and
# `runtime_deps:` below at job time and installs exactly what it finds,
# so carrying a wheel never edits a workflow file — and the sync
# identity's PAT therefore does not need `workflow` write scope. A
# token that can rewrite CI can rewrite the thing checking its own
# work; that is not what "contents + pull-request write and nothing
# else" permits.
#
# Editing `wheel:` without adding the matching file under .github/vendor/
# fails CI loudly on the next run. That is deliberate: a loud failure
# beats a silent validation against a stale wheel.

package: contextlayer-snapshot
version: 0.5.0
wheel: contextlayer_snapshot-0.5.0-py3-none-any.whl
sha256: 88b9650613325319a414736bc2f744004390568208c76325ca0327bfdc7df394
platform_commit: f38b75c12753399c6a3b2815e6b58692c3c223de
built: 2026-07-20
built_by: contextlayer-sync (sync spec §10 wheel carry)
source: platform repo (local, no public remote) — DataProject
runtime_deps_pinned_in: this file (runtime_deps)

# Installed with --no-deps alongside the wheel. Pinned exactly; kb-ci.yml
# reads this list rather than carrying its own copy.
runtime_deps:
  - jsonschema[format-nongpl]==4.26.0
  - PyYAML==6.0.3
  - jinja2==3.1.6
